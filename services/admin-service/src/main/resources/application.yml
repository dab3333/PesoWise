server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pesowise_admin}
    username: ${DB_USER:pesowise}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

pesowise:
  services:
    # Compose DNS names — admin-service calls all three directly, not back through the gateway,
    # exactly as planning-service already calls ledger-service. The /internal/admin/** paths on
    # each are unreachable any other way: the gateway has no route for /internal/**.
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    ledger-url: ${LEDGER_SERVICE_URL:http://localhost:8082}
    planning-url: ${PLANNING_SERVICE_URL:http://localhost:8083}

spring.cloud.openfeign:
  # The default client (java.net.HttpURLConnection) cannot send PATCH at all. OkHttp can.
  okhttp:
    enabled: true
  client:
    config:
      default:
        # One slow dependency must not hang the whole overview page.
        connectTimeout: 2000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    ph.pesowise: INFO
