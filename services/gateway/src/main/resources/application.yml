server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Downstream services are reached by Compose DNS name; no discovery client.
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: ledger-service
          uri: ${LEDGER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/accounts/**,/api/categories/**,/api/transactions/**,/api/reports/**

        - id: planning-service
          uri: ${PLANNING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/budgets/**,/api/goals/**,/api/debts/**,/api/recurring/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600

pesowise:
  jwt:
    secret: ${JWT_SECRET}
  # Paths that skip JWT validation. Everything else requires a valid bearer token.
  auth:
    public-paths:
      - /api/auth/register
      - /api/auth/login
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
