server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Downstream services are reached by Compose DNS name; no discovery client.
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: ledger-service
          uri: ${LEDGER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/accounts/**,/api/categories/**,/api/transactions/**,/api/reports/**,/api/data/ledger/**

        - id: planning-service
          uri: ${PLANNING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/budgets/**,/api/goals/**,/api/debts/**,/api/recurring/**,/api/data/planning/**

        # /api/admin/** is gated by the admin-paths rule below; /api/feedback/** is not — any
        # signed-in user can submit feedback. Both live in the same service, so one route covers
        # them. Note there is deliberately no route for /internal/**: that prefix is reachable
        # only over the Compose network, by admin-service's own Feign clients.
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/admin/**,/api/feedback/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600

pesowise:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    # Skip JWT validation entirely. Matched EXACTLY, not by prefix — adding a path here opens
    # precisely that one URL and nothing beneath it. Every entry must be safe to call
    # anonymously; the token-bearing ones are safe because the token is the credential.
    public-paths:
      - /api/auth/register
      - /api/auth/login
      - /api/auth/verify-email
      - /api/auth/resend-verification
      - /api/auth/forgot-password
      - /api/auth/reset-password
      - /actuator/health
    # Require the ADMIN role on top of a valid token. Matched by PREFIX, so anything added
    # under one of these is protected by default rather than by remembering to list it.
    admin-paths:
      - /api/admin/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
