server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: planning-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pesowise_planning}
    username: ${DB_USER:pesowise}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

pesowise:
  ledger:
    # Compose DNS name — planning-service calls ledger-service directly, not back through
    # the gateway, and passes the verified X-User-Id along explicitly.
    url: ${LEDGER_SERVICE_URL:http://localhost:8082}

spring.cloud.openfeign.client.config.default:
  # A budget page that hangs is worse than one that reports the ledger is unreachable.
  connectTimeout: 2000
  readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    ph.pesowise: INFO
