name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: mvn test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - ledger-service
          - planning-service
          - admin-service
          - gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: services/${{ matrix.service }}
        run: mvn -B test

  backend-integration:
    name: mvn verify -Pintegration (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gateway has no database and no Testcontainers tests — the other four do.
        service:
          - auth-service
          - ledger-service
          - planning-service
          - admin-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships a working Docker daemon, which is exactly what these tests could
      # never get on the development machine — see docs/development.md's Testcontainers note.
      - name: mvn verify -Pintegration
        working-directory: services/${{ matrix.service }}
        run: mvn -B verify -Pintegration

  frontend:
    name: typecheck + lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
