server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users keep loading a stale bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Proxy the API to the gateway so the browser makes same-origin requests only and CORS
    # never enters the picture.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The gateway strips any inbound X-User-Id, but clearing it here too means a spoofed
        # header never even reaches it.
        proxy_set_header X-User-Id         "";
    }

    # SPA fallback: React Router owns the client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
